services:
  db:
    image: postgres:15-alpine
    container_name: campus_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: campus_password
      POSTGRES_DB: campus_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - campus_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d campus_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: campus_node_api
    restart: always
    environment:
      DB_HOST: db
      DB_USER: admin
      DB_PASSWORD: campus_password
      DB_NAME: campus_db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - campus_net

  nginx:
    image: nginx:alpine
    container_name: campus_nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - backend
    networks:
      - campus_net

volumes:
  pgdata:

networks:
  campus_net:
    driver: bridge